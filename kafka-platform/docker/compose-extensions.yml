# ─── Jaeger (Distributed Tracing) ──────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agent-platform-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Collector HTTP ingestion
      - "14250:14250"   # gRPC ingestion
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=postgres
      - PG_SERVER=postgres
      - PG_DATABASE=agent_platform
      - PG_USER=agent
      - PG_PASSWORD=agent
    depends_on:
      postgres:
        condition: service_healthy

# ─── Optional: OTel Collector (unified metrics/logs/traces) ────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: agent-platform-otel
    command: ["--config", "/etc/otelcol-contrib/otel-config.yaml"]
    volumes:
      - ./docker/otel-config.yaml:/etc/otelcol-contrib/otel-config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus metrics scrape
    depends_on:
      - kafka
      - jaeger
