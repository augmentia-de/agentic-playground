services:
  # ─── Kafka — PLAINTEXT (Development) ──────────────────
  kafka-dev:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-dev
    container_name: agent-platform-kafka-dev
    restart: "no"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dev:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ─── Kafka — TLS+SASL (Production Profile) ──────────
  kafka-tls:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-tls
    container_name: agent-platform-kafka-tls
    restart: unless-stopped
    ports:
      - "9092:9092"
    command: ["/bin/bash", "-c", "chmod +r /etc/kafka/secrets/*.jks && exec /etc/confluent/docker/run"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-tls:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      # TLS Config
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: kfk-pass
      KAFKA_SSL_KEY_PASSWORD: kfk-pass
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: kfk-pass
      KAFKA_SSL_CLIENT_AUTH: required
      # SASL Config
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka-tls:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    profiles: ["tls", "prod"]

  postgres:
    image: postgres:16
    hostname: postgres
    container_name: agent-platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    hostname: redis
    container_name: agent-platform-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── HashiCorp Vault (Dev Mode) ──────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: agent-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-token-dev-only"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ─── Prometheus ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agent-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - orchestrator
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: agent-platform-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Jaeger (Distributed Tracing) ────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agent-platform-jaeger
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # Collector HTTP
      - "14250:14250"   # gRPC
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    profiles: ["observability", "tls", "prod"]

  # ─── OpenTelemetry Collector ─────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: agent-platform-otel
    command: ["--config", "/etc/otelcol-contrib/otel-config.yaml"]
    volumes:
      - ./docker/otel-config.yaml:/etc/otelcol-contrib/otel-config.yaml
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus metrics
    profiles: ["observability", "tls", "prod"]

  # ─── Orchestrator (TLS Client) ──────────────────────
  orchestrator:
    image: agent-platform/orchestrator:1.0.0-SNAPSHOT
    build:
      context: .
      dockerfile: Dockerfile-agent-orchestrator
    depends_on:
      kafka-dev:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      KAFKA_BOOTSTRAP_SERVERS: kafka-dev:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      OTEL_ZIPKIN_URL: http://jaeger:9411
      OTEL_SAMPLING_RATE: "0.1"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root-token-dev-only
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
      # Metrics port — changed from 9090 to avoid conflict with Prometheus
      - "18090:9090"

  # ─── Worker (Legacy) ────────────────────────────────
  # 2026-09: detached from the agent.tasks.* bus — replaced by quad-worker
  # (canonical TaskEvent/ResultEvent contract). The legacy worker now only listens
  # on legacy\.agent\.tasks\..* and is therefore no longer started.
  #   worker:
  #     image: agent-platform/worker:1.0.0-SNAPSHOT
  #     build:
  #       context: .
  #       dockerfile: Dockerfile-agent-worker
  #     depends_on:
  #       kafka-dev:
  #         condition: service_healthy
  #       orchestrator:
  #         condition: service_started
  #     environment:
  #       KAFKA_BOOTSTRAP_SERVERS: kafka-dev:9092
  #       WORKER_GROUP_ID: agent-worker-group
  #       SPRING_PROFILES_ACTIVE: dev

  # ─── Quad Workflow Worker ───────────────────────────
  quad-worker:
    image: augmentia/quad-workflow-worker:1.0.0-SNAPSHOT
    build:
      context: ./quad-workflow-worker
      dockerfile: Dockerfile
    depends_on:
      kafka-dev:
        condition: service_healthy
    ports:
      - "8092:8092"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-dev:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek/deepseek-v4-flash-0731}
      SPRING_CONFIG_IMPORT: optional:file:.env[.properties]
      SERVER_PORT: 8092
    volumes:
      - ./quad-workflow-worker/.env:/app/.env:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  kafka-data:
