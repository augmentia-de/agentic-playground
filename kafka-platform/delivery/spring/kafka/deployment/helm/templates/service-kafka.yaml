apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: kafka
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9092"
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
      protocol: TCP
  selector:
    app.kubernetes.io/name: kafka
