name: CI

# The test suite starts real Postgres and Kafka instances (Testcontainers
# resp. spring-kafka-test). Therefore it needs Docker in the CI runner.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers needs the Docker socket. On ubuntu-latest Docker is
      # preinstalled; the connection runs via /var/run/docker.sock.
      - name: Docker available
        run: docker info > /dev/null && docker --version

      - name: Maven Verify
        run: mvn -B -ntp clean verify

      - name: Summarise result
        if: always()
        run: |
          {
            echo "### Test results"
            find . -path '*/surefire-reports/*.txt' -exec grep -H "Tests run" {} \; \
              | sed 's|./||' || echo "no reports"
          } >> "$GITHUB_STEP_SUMMARY"
