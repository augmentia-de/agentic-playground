{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kafka-platform.fullname" . }}-sa
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: {{ include "kafka-platform.name" . }}
    app.kubernetes.io/component: orchestrator
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kafka-platform.fullname" . }}-sa-binding
  namespace: {{ .Release.Namespace | default "default" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: {{ include "kafka-platform.fullname" . }}-sa
    namespace: {{ .Release.Namespace | default "default" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka-platform.fullname" . }}-config
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/name: {{ include "kafka-platform.name" . }}
    app.kubernetes.io/component: orchestrator
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.externalBootstrapServers | default "kafka-kafka.{{ .Release.Namespace | default "default" }}.svc.cluster.local:9092" | quote }}
  SPRING_KAFKA_CLIENT_PROTOCOL: {{ .Values.kafka.clientProtocol | quote }}
  SPRING_DATA_REDIS_HOST: redis-master.{{ .Release.Namespace | default "default" }}.svc.cluster.local
  SPRING_FLYWAY_ENABLED: "true"
  APP_ORCHESTRATION_DEFAULT_TIMEOUT_MS: "60000"
  APP_ORCHESTRATION_DEFAULT_MAX_ATTEMPTS: "3"
  APP_HITL_TTL_HOURS: "24"
  APP_HITL_MAX_ESCALATIONS: "3"
  APP_SEEDING_ENABLED: "true"
{{- if .Values.vault.enabled }}
  VAULT_ADDR: {{ .Values.vault.injectAgentSecrets | ternary (print "http://vault." (.Release.Namespace | default "default") ".svc.cluster.local:8200") "http://vault:8200" | quote }}
  APP_VAULT_PATH_PREFIX: {{ .Values.vault.pathPrefix | quote }}
{{- end }}
{{- range $key, $value := .Values.orchestrator.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.vault.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-platform.fullname" . }}-vault-env
  namespace: {{ .Release.Namespace | default "default" }}
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-secret-database: {{ .Values.vault.agentPath }}/database
    vault.hashicorp.com/agent-inject-template-database: |
      {{- if index $.Values "postgresql-password" }}
      export POSTGRES_PASSWORD={{ index $.Values "postgresql-password" }}
      {{- else }}
      {{- with secret .Values.vault.agentPath "/database" }}
      export DB_USERNAME={{ .Data.username }}
      export DB_PASSWORD={{ .Data.password }}
      {{- end }}
      {{- end }}
    vault.hashicorp.com/agent-inject-secret-shared: {{ .Values.vault.sharedPath }}
    vault.hashicorp.com/agent-inject-template-shared: |
      {{- with secret .Values.vault.sharedPath }}
      export LLM_API_KEY={{ .Data.llmApiKey }}
      export OAUTH_SECRET={{ .Data.oauthSecret }}
      {{- end }}
    vault.hashicorp.com/role: {{ .Values.vault.role }}
    vault.hashicorp.com/namespace: {{ .Values.vault.namespace | default "default" }}
{{- end }}
