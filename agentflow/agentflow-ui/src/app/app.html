<div class="shell">
  <header class="topbar">
    <span class="brand">AgentFlow</span>
    <span class="badge">durable · graph · quad</span>
    <span class="spacer"></span>
    <span class="small dim">
      <span [class]="'dot ' + health()"></span>
      Backend {{ health() }}
    </span>
    <a class="btn small" [href]="temporalUi()" target="_blank" rel="noopener">Temporal UI ↗</a>
    <button class="ghost small" (click)="toggleTheme()" title="Theme umschalten">◐</button>
  </header>

  <aside class="sidebar">
    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          <span class="icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="toasts">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="toast"
      [class.success]="t.kind === 'success'"
      [class.error]="t.kind === 'error'"
      [class.info]="t.kind === 'info'"
      (click)="toast.dismiss(t.id)"
    >
      {{ t.text }}
    </div>
  }
</div>
